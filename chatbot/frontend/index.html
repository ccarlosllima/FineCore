<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chatbot - Empresa Local</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .chatbox {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
    }
    .mensagem {
      margin-bottom: 10px;
    }
    .usuario {
      font-weight: bold;
      color: #483285;
    }
    .bot {
      color: #333;
    }
    input, button {
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #483285;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #372465;
    }
  </style>
</head>
<body>
  <div class="chatbox">
    <h2>Atendente Virtual</h2>
    <div id="conversa"></div>
    <input type="text" id="pergunta" placeholder="Digite sua pergunta..." />
    <button onclick="enviarPergunta()">Enviar</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
